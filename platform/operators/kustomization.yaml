# Cluster-wide operators. Their CRDs are too large for client-side apply, so this is installed
# once per cluster, before the app manifests:
#   kubectl apply --server-side -k platform/operators
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.1/cnpg-1.30.1.yaml
