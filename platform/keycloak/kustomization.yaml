apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
configMapGenerator:
  # ${PUBLIC_URL} and ${BACKEND_CLIENT_SECRET} are replaced by Keycloak from its environment.
  - name: keycloak-realm
    files:
      - cragradar-realm.json
