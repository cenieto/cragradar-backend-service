# No host here: the cloud overlay adds the domain and TLS.
# /tiles goes through the nginx tile cache, which authorizes every request.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /tiles
            pathType: Prefix
            backend:
              service:
                name: tile-cache
                port:
                  name: http
