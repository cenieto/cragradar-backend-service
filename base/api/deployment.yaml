# API: admin, uploads (tus), images, and /api/authz for the nginx tile cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: cragradar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: cragradar
    spec:
      # Applies pending database migrations before the API starts.
      initContainers:
        - name: migrate
          image: cragradar-backend
          command: ["cragradar-migrate", "upgrade", "head"]
          env:
            - name: CRAGRADAR_SETTINGS_FILE
              value: /etc/cragradar/settings.yaml
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: cragradar-config
                  key: PUBLIC_URL
            - name: CRAGRADAR_OIDC__ISSUER
              value: $(PUBLIC_URL)/auth/realms/cragradar
            # Created by CloudNativePG for the owner of the `cragradar` database.
            - name: CRAGRADAR_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri
          volumeMounts:
            - name: settings
              mountPath: /etc/cragradar
              readOnly: true
      containers:
        - name: api
          image: cragradar-backend
          command: ["uvicorn", "cragradar_backend.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: CRAGRADAR_SETTINGS_FILE
              value: /etc/cragradar/settings.yaml
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: cragradar-config
                  key: PUBLIC_URL
            - name: CRAGRADAR_OIDC__ISSUER
              value: $(PUBLIC_URL)/auth/realms/cragradar
            # Created by CloudNativePG for the owner of the `cragradar` database.
            - name: CRAGRADAR_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
          volumeMounts:
            - name: settings
              mountPath: /etc/cragradar
              readOnly: true
            - name: image-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: settings
          configMap:
            name: backend-settings
        - name: image-data
          persistentVolumeClaim:
            claimName: image-data
