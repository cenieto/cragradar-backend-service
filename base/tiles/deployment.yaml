apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiles
  labels:
    app.kubernetes.io/name: tiles
    app.kubernetes.io/part-of: cragradar
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tiles
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tiles
        app.kubernetes.io/part-of: cragradar
    spec:
      containers:
        - name: tiles
          image: cragradar-backend
          command: ["uvicorn", "cragradar_backend.tiles.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /tiles/healthz
              port: http
          livenessProbe:
            httpGet:
              path: /tiles/healthz
              port: http
          volumeMounts:
            - name: image-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: image-data
          persistentVolumeClaim:
            claimName: image-data
